<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetflixPage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
    <img src="public/netflix page (logo).png" class="logo" alt="Logo Netflix">

    <h1 class="title">Quem está assistindo?</h1>

    <div class="perfis-wrapper">
    
        <div class="perfis-container">
            <div class="perfil-item">
                <img src="public/perfil 1.png" class="perfil" alt="Perfil 1">
                <span class="perfil-name">Gaby</span>  
            </div>  
            <div class="perfil-item">
                <img src="public/perfil 2.png" class="perfil" alt="Perfil 2">
                <span class="perfil-name">Santana</span>
            </div>
            <div class="perfil-item">
                <img src="public/perfil 3.png" class="perfil" alt="Perfil 3">
                <span class="perfil-name">João</span>
            </div>
            <div class="perfil-item">
                <img src="public/add perfil.png" class="perfil" alt="Add Perfil">
                <span class="perfil-name">Adicionar Perfil</span>
            </div>
        </div>

        
        <button class="button">Gerenciar Perfis</button>
    </div>

</div>
          
</body>
</html>
